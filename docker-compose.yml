# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: velora
      POSTGRES_PASSWORD: velora
      POSTGRES_DB: velora
    ports:
      - "5432:5432"
    volumes:
      - velora-pg:/var/lib/postgresql/data
volumes:
  velora-pg:
